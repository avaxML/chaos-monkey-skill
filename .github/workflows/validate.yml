name: validate

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  skill:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Agent Skills validator
        run: |
          python -m pip install \
            "skills-ref @ git+https://github.com/agentskills/agentskills.git@69ef37e9424c0a7ea9dd2293b559e43ec8176379#subdirectory=skills-ref"
      - name: Validate Agent Skill
        run: skills-ref validate skills/chaos-monkey
      - name: Supplemental checks
        run: |
          python3 - <<'PY'
          import json, re
          from pathlib import Path
          text = Path("skills/chaos-monkey/SKILL.md").read_text()
          fm = text.split("\n---\n", 1)[0]
          m = re.search(r'^\s+version:\s*"?([0-9]+\.[0-9]+\.[0-9]+)"?', fm, re.M)
          assert m, "metadata.version missing"
          version = m.group(1)
          assert f"## {version} " in Path("CHANGELOG.md").read_text(), f"CHANGELOG lacks {version}"
          assert Path("skills/chaos-monkey/LICENSE").exists(), "bundled LICENSE missing"
          evals = json.loads(Path("evals/trigger-queries.json").read_text())
          assert all({"query", "should_trigger"} <= set(e) for e in evals)
          print(f"supplemental ok (version {version})")
          PY
